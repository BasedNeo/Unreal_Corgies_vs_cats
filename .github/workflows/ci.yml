name: gate
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35 # W11: run 139 was cancelled at 20 min (a 6 min browser install + unit + e2e)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run gate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: artifacts/
          if-no-files-found: ignore
