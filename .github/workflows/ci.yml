name: gate
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35 # W11: run 139 was cancelled at 20 min (a 6 min browser install + unit + e2e)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run gate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: artifacts/
          if-no-files-found: ignore
  godot:
    # W12: the Godot game is the main build. Its headless tests run on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm g.zip
          fi
      - name: Godot headless tests
        run: ~/godot/godot --headless --path engines/godot --script res://tests/run.gd

